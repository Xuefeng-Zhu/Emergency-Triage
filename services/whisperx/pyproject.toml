[project]
name = "emergency-trial-whisperx"
version = "0.1.0"
description = "Durable WhisperX finalization worker"
requires-python = ">=3.11,<3.14"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "whisperx>=3.3,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
